name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installer les dépendances
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
          g++ gcc make

    - name: Installer Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer "cython<3.0"

    - name: Construire l'APK
      run: |
        yes | buildozer android debug 2>&1 | tail -150

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jinx-apk
        path: bin/*.apk
