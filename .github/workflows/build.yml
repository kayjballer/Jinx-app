name: Créer un APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation de Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installer les dépendances système (g++ + ccache)
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk python3-pip python3-venv \
          autoconf automake libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          g++ gcc make ccache

    - name: Diagnostiquer l'environnement
      run: |
        echo "=== RAM ==="
        free -h
        echo "=== Disque ==="
        df -h
        echo "=== g++ version ==="
        g++ --version || echo "g++ MANQUANT"
        echo "=== ccache version ==="
        ccache --version || echo "ccache MANQUANT"

    - name: Installer Buildozer
      run: |
        pip install --upgrade pip setuptools wheel
        pip install --upgrade buildozer "cython<3.0"
        buildozer --version

    - name: Accepter les licences du SDK Android
      run: |
        echo "y" | buildozer android update || true

    - name: Nettoyer la version précédente
      run: rm -rf .buildozer

    - name: Restaurer le keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > jinx.keystore
        chmod 600 jinx.keystore
        ls -la jinx.keystore

    - name: Compiler llama-server (arm64)
      run: |
        git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
        NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
        cmake -S /tmp/llama.cpp -B /tmp/llama-build \
          -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
          -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF \
          -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON \
          -DGGML_CPU_ARM_ARCH=armv8-a -DGGML_NATIVE=OFF
        cmake --build /tmp/llama-build --target llama-server -j4
        mkdir -p libs/arm64-v8a
        cp /tmp/llama-build/bin/llama-server libs/arm64-v8a/libllama_server.so
        chmod +x libs/arm64-v8a/libllama_server.so
        ls -lh libs/arm64-v8a

    - name: Construire avec Buildozer
      env:
        MAKEFLAGS: "-j1"
        USE_CCACHE: "1"
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/jinx.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
        P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -o pipefail
        # Réduire la conso RAM : -j1
        buildozer -v android debug > /tmp/build.log 2>&1 || true
        echo "=== 100 DERNIÈRES LIGNES ==="
        tail -100 /tmp/build.log
        echo "=== RECHERCHE ERREURS ==="
        grep -n -i -E "error:|failed|fatal|BUILD FAILED|STOPPED|killed|Traceback|No such" /tmp/build.log | tail -30 || echo "Aucune erreur détectée"

    - name: Upload log complet
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/build.log
        if-no-files-found: ignore

    - name: Vérifier l'APK
      id: check_apk
      run: |
        ls -la bin/ || echo "bin/ n'existe pas"
        if ls bin/*.apk 1>/dev/null 2>&1; then
          echo "apk_existe=true" >> $GITHUB_OUTPUT
        else
          echo "apk_existe=false" >> $GITHUB_OUTPUT
        fi

    - name: Re-signer avec notre keystore
      if: steps.check_apk.outputs.apk_existe == 'true'
      run: |
        BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ 2>/dev/null | sort -V | tail -1)
        APKSIGNER="${BUILD_TOOLS}apksigner"
        ZIPALIGN=$(ls -d ${ANDROID_HOME}/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
        for APK in bin/*.apk; do
          $ZIPALIGN -f -p 4 "$APK" "${APK}.aligned"
          $APKSIGNER sign --ks jinx.keystore \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            "${APK}.aligned"
          mv "${APK}.aligned" "$APK"
          $APKSIGNER verify -v "$APK" || true
        done

    - name: Téléverser un APK
      if: steps.check_apk.outputs.apk_existe == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: jinx-apk
        path: bin/*.apk
