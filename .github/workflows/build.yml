name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installer les dépendances
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
          g++ gcc make

    - name: Installer Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer "cython<3.0"

    - name: Compiler llama-server (arm64)
      run: |
        git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
        NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
        cmake -S /tmp/llama.cpp -B /tmp/llama-build \
          -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
          -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF \
          -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON \
          -DGGML_CPU_ARM_ARCH=armv8-a -DGGML_NATIVE=OFF
        cmake --build /tmp/llama-build --target llama-server -j4
        mkdir -p libs/arm64-v8a
        cp /tmp/llama-build/bin/llama-server libs/arm64-v8a/libllama_server.so
        chmod +x libs/arm64-v8a/libllama_server.so
        ls -lh libs/arm64-v8a

    - name: Construire l'APK
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee /tmp/build.log | tail -200
        exit ${PIPESTATUS[0]}

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: jinx-apk
        path: bin/*.apk

    - name: Upload log (si échec)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/build.log
        if-no-files-found: ignore
