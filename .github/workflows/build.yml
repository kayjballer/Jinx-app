name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libtool-bin pkg-config

      - name: Install buildozer
        run: pip install --upgrade buildozer cython

      - name: Accept Android SDK licenses
        run: yes | buildozer android update || true

      - name: Clean previous build
        run: rm -rf .buildozer

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Compile llama-server (arm64)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod"
          cmake --build /tmp/llama-build --target llama-server -j4
          mkdir -p libs/arm64-v8a
          cp /tmp/llama-build/bin/llama-server libs/arm64-v8a/libllama_server.so
          ls -lh libs/arm64-v8a
      - name: Build with buildozer
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jinx-apk
          path: bin/*.apk
